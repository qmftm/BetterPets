# 과급식 이스터에그로 변하는 돼지.
#
# 짧은 시간 안에 먹이를 몰아주면 이 종류로 바뀐다.
# 어떤 펫으로 바뀔지는 config.yml 의 gimmick.overfeed.becomes 에서 정한다.
#
# 원작에서도 "탈것인 돼지"로 진화하는 기믹이라 걷는 탑승은 된다.

id: pig
display-name: "<light_purple>돼지"
model: pet_pig
rarity: D
growth-max: -1          # 음수 = 성장도 없음. next-stage 가 없는 종류의 권장 값

# 탑승 여부와 비행 여부를 따로 켠다.
ride: true

animations:
  idle: idle
  walk: walk
  run: run
  eat: eat

movement:
  follow-distance: 2.0
  walk-speed: 0.22       # 살쪄서 느리다
  run-speed: 0.35
  teleport-distance: 24.0

acquire:
  gacha-weight: 0        # 알에서는 나오지 않는다. 과급식으로만 얻는다
