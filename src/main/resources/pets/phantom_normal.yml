# 진화 사슬의 끝 — baby_phantom 에서 70% 확률로 여기 도착한다.
# next-stage 가 없고 growth-max 도 -1 이라, 이 펫은 성장도가 아예 없다
# (성장도의 유일한 역할이 진화라서다).

id: phantom_normal
display-name: "<gray>팬텀"
model: phantom_normal
rarity: A
growth-max: -1          # 음수 = 성장도 없음. next-stage 가 없는 종류의 권장 값
# icon: NETHER_STAR      # 보관함 아이콘 재질. 안 적으면 LEAD
# icon-glow: true        # 보관함 아이콘에 인챈트 반짝임을 항상 켜둔다. 안 적으면 꺼져 있다
                          # (소환 중일 때는 icon-glow 와 무관하게 항상 반짝인다)

# 나는 탑승. 개체별 추첨은 없다 — flying 인 종류는 전부 난다.
ride: true
flying: true

# 모델이 커서 실제 크기보다 눈에 띄게 키운다.
size: 2
# 판정(히트박스·클릭) 크기는 안 적으면 size 를 그대로 쓴다. 모델은 크게 그리되
# 클릭 자리는 원래 크기로 두고 싶으면 따로 적는다.
# hitbox-scale: 1.0

# 탑승 속도. 등급은 표기 전용이라 등급별 기본값은 없다 — 안 적으면 고정 기본값을 쓴다.
# ride-speed: 0.5

# 비행 중 수평 속도를 걷는 탑승과 다르게 쓰고 싶으면 여기에 적는다.
# 안 적으면 ride-speed 를 그대로 쓴다.
# flight-speed: 0.7

# 이 펫만 다른 상승력을 쓰고 싶으면 여기에 적는다. 안 적으면 config.yml 의
# ride.flight-lift 전역값을 그대로 쓴다.
# flight-lift: 0.6

# 탑승 시 앉는 높이를 기본 자리에서 위(+)·아래(-)로 밀어낸다. size 가 큰 이
# 펫은 플레이어가 몸통에 파묻혀 보일 수 있어 예시로 남겨둔다. 안 적으면
# config.yml 의 ride.seat-offset 전역값(기본 0)을 쓴다.
# seat-offset: 0.3

animations:
  idle: idle
  walk: walk
  run: run
  fly: fly
  ride: ride
  eat: eat

movement:
  follow-distance: 3.0
  walk-speed: 0.28
  run-speed: 0.50
  teleport-distance: 28.0

acquire:
  gacha-weight: 0        # 랜덤 알에서는 안 나온다. egg 를 키워야 나온다
