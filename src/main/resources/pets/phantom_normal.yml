# 진화 사슬의 끝 — baby_phantom 에서 70% 확률로 여기 도착한다.
# next-stage 가 없으므로 더 자라지 않는다(성장도의 유일한 역할이 진화라서다).

id: phantom_normal
display-name: "<gray>팬텀"
model: phantom_normal
rarity: A
growth-max: 100

# 나는 탑승. 개체별 추첨은 없다 — flying 인 종류는 전부 난다.
ride: true
flying: true

# 모델이 커서 실제 크기보다 눈에 띄게 키운다.
size: 2

# 이 펫만 다른 상승력을 쓰고 싶으면 여기에 적는다. 안 적으면 config.yml 의
# ride.flight-lift 전역값을 그대로 쓴다.
# flight-lift: 0.6

animations:
  idle: idle
  walk: walk
  run: run
  fly: fly
  ride: ride
  eat: eat

movement:
  follow-distance: 3.0
  walk-speed: 0.28
  run-speed: 0.50
  teleport-distance: 28.0

abilities:
  - id: attribute_speed
    base: 0.05
  - id: attribute_health
    base: 2.0
  - id: on_kill_extra_drop
    chance-base: 0.05

acquire:
  gacha-weight: 0        # 랜덤 알에서는 안 나온다. egg 를 키워야 나온다
