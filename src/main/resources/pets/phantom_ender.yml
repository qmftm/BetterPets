# 진화 사슬의 끝 — baby_phantom 에서 30% 확률로 여기 도착한다. phantom_normal 보다
# 희귀한 변종이라는 뜻으로 가중치를 낮게 뒀다(pets/baby_phantom.yml 참고).
# next-stage 가 없고 growth-max 도 -1 이라, 이 펫은 성장도가 아예 없다.

id: phantom_ender
display-name: "<light_purple>엔더 팬텀"
model: phantom_ender
rarity: A
growth-max: -1          # 음수 = 성장도 없음. next-stage 가 없는 종류의 권장 값

icon: phantom_spawn_egg

ride: true
flying: true

# 비행 중 수평 이동 속도. 안 적으면 ride-speed(안 적으면 고정 기본값 0.28)를 그대로 쓴다.
flight-speed: 0.86

# 탑승 시 플레이어가 앉는 높이를 기본 자리에서 위(+)·아래(-)로 밀어낸다. size 가 커서
# 기본 자리 그대로면 몸통에 파묻혀 보일 수 있다. 안 적으면 config.yml 의
# ride.seat-offset 전역값(지금 0.0)을 그대로 쓴다.


size: 2

animations:
  idle: idle
  walk: walk
  run: run
  fly: fly
  ride: ride
  eat: eat

movement:
  follow-distance: 3.0
  walk-speed: 0.28
  run-speed: 0.50
  teleport-distance: 28.0

acquire:
  gacha-weight: 0
