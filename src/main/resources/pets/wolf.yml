# 펫 종류 정의 예시 — 지상 펫.
#
# model 값은 plugins/BetterModel/models/<이름>.bbmodel 의 파일명(확장자 제외)이다.
# 모델 제작 규격은 docs/MODELING.md 참고.

id: wolf
display-name: "<white>늑대"
model: pet_wolf
rarity: C
growth-max: 100

# 보관함 아이콘 재질. 실제 3D 모델(위의 model)과는 별개다 — 안 적으면 LEAD.
# icon: BONE

# 모델 크기 배율. 1.0 이 원래 크기 — 크게/작게 보이고 싶을 때만 적는다.
# size: 1.2

# 탑승 여부와 비행 여부를 따로 켠다. GROUND 였던 펫은 ride: true 만 켜면 된다.
ride: true
# flying: true

# 탑승 속도(블록/틱)는 등급(rarity.yml 의 ride-speed)이 기본값이다. 이 펫만 다르게
# 하고 싶으면 여기에 적는다 — fly-chance 와 같은 자리다.
# ride-speed: 0.24

# 모델의 실제 애니메이션 이름과 매핑한다.
# 생략하면 논리 이름(idle/walk/run)을 그대로 쓴다.
animations:
  idle: idle
  walk: walk
  run: run
  eat: eat

movement:
  follow-distance: 2.0
  walk-speed: 0.25
  run-speed: 0.45
  teleport-distance: 24.0

abilities:
  - id: attribute_speed
    base: 0.03
    per-growth: 0.0003

# next-stage 를 정의하지 않았으므로, growth.max-stage 를 2 이상으로 올려도
# 늑대는 계속 늑대로 남고 단계 수만 늘어난다.
# 실제로 다른 펫이 되는 예시는 pets/hatchling.yml 을 보라.

acquire:
  gacha-weight: 50
