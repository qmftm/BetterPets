# 펫 종류 정의 예시 — 탑승·비행 펫.
#
# 탑승 펫은 모델에 p_seat 본이 있어야 한다. docs/MODELING.md 참고.

id: dragon
display-name: "<gold>드래곤"
model: pet_dragon
rarity: S
growth-max: 100

# 탑승 방식: NONE(탑승 불가) / GROUND(걷는 탑승) / FLY(나는 탑승)
ride: FLY

# 성체가 될 때 이 확률로 비행이 확정된다. FLY 인데 추첨에 실패한 개체는
# 걷는 탑승까지만 된다 — 원작에서도 같은 종의 일부만 날탈이 된다.
# ride 가 FLY 가 아니면 이 값은 쓰이지 않는다.
fly-chance: 0.35

animations:
  idle: idle
  walk: walk
  run: run
  fly: fly
  ride: ride
  eat: eat

movement:
  follow-distance: 3.0
  walk-speed: 0.28
  run-speed: 0.50
  teleport-distance: 28.0

abilities:
  - id: attribute_speed
    base: 0.05
    per-growth: 0.0005
  - id: attribute_health
    base: 2.0
    per-growth: 0.02
  - id: on_kill_extra_drop
    chance-base: 0.05
    chance-per-growth: 0.002

# next-stage 를 정의하지 않았으므로 드래곤은 단계가 올라도 계속 드래곤이다.
# docs/DESIGN.md 의 "성장 단계" 절 참고.

acquire:
  gacha-weight: 1
