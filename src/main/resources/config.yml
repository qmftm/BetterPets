# BetterPets 설정
#
# 이 서버는 동시 접속 5명 내외를 전제로 설계했다. 거리 LOD 나 커넥션 풀 같은
# 대규모 최적화는 의도적으로 넣지 않았다. 자세한 근거는 docs/DESIGN.md 참고.

# 언어. plugins/BetterPets/lang/<코드>.yml 을 읽는다.
# 기본 제공: ko_kr, en_us. 새로 만들려면 lang/ko_kr.yml 을 복사해 번역한다.
# 번역이 빠진 키는 내장 한국어로 채워지므로, 바꾸고 싶은 줄만 남겨도 된다.
language: ko_kr

# 서버 전체 알림. 희귀한 일에만 울려야 소음이 되지 않는다.
broadcast:
  enabled: true

  # 이 등급 이상일 때만 알린다. D C B A S 중 하나.
  # D 로 두면 사실상 모든 펫을 알리게 되니 채팅이 밀린다.
  min-rarity: A

  # 이 성장 단계 이상일 때만. 1 이면 단계 조건 없음.
  #
  # 주의: 알에서 갓 나온 펫은 언제나 1단계다. 2 이상으로 두면 on-obtain 알림은
  # 사실상 꺼진다. "일정 단계를 넘겼을 때 알린다"가 목적이라면 on-stage-up 을 켠다.
  min-growth-stage: 1

  on-obtain: true      # 알에서 나왔을 때 (뽑기 자랑)
  on-grown: true       # 다 자랐을 때 (키운 결과)
  on-stage-up: false   # 성장 단계가 올랐을 때. max-stage 가 1이면 일어나지 않는다
  sound: true          # 알림과 함께 효과음

integrations:
  # DiscordSRV 가 있으면 같은 알림을 Discord 로도 보낸다. 없으면 조용히 꺼진다.
  discord:
    enabled: true
    # DiscordSRV 의 게임 채널 이름. DiscordSRV config.yml 의 Channels 에 있는 키다.
    channel: global

  # Geyser(Bedrock) 대응.
  bedrock:
    # Bedrock 플레이어는 비행 이륙 확인(한 번 더 우클릭)을 건너뛴다.
    # 터치 조작에서 3초 안에 두 번째 우클릭을 맞히기가 어렵기 때문이다.
    # 구분에는 Floodgate 가 필요하다 — 없으면 전원 자바로 취급한다.
    skip-mount-confirm: true

pets:
  # 한 명이 보유할 수 있는 펫 마릿수. 한도에 닿으면 알을 우클릭해도
  # 아이템이 소비되지 않고 안내만 나간다.
  #
  # 0 이면 무제한이다. 보관함 GUI 는 한 쪽에 45마리씩 보여주므로,
  # 큰 값을 넣으면 쪽 넘김이 잦아진다.
  max-owned: 20

  # 동시에 소환해 둘 수 있는 펫 마릿수. 0 이면 무제한이다.
  #
  # 한도가 찬 상태에서 새로 소환하면 가장 먼저 소환했던 펫이 자동으로
  # 돌아간다 — 1 로 두면 예전처럼 "소환하면 교체" 동작이 된다.
  #
  # 올리기 전에 알아둘 것: 소환한 펫마다 캐리어 엔티티와 렌더 트래커가
  # 하나씩 생기고, 성체 펫의 능력치 보너스도 마리 수만큼 겹쳐서 붙는다.
  max-active: 1

growth:
  # 먹이 한 번에 오르는 성장도. 원작(우유)은 10이다.
  # 시간 경과는 1분당 +1 로 고정이며 설정 대상이 아니다.
  feed-amount: 10

  # 성장 단계 최대 개수.
  #
  # 1(기본값) — 성장도가 다 차면 바로 성체가 된다. 예전과 동일한 동작이다.
  # 2 이상 — 성장도가 찰 때마다 pets/*.yml 의 next-stage 가중치로 다음 형태를
  #          추첨하고, 성장도를 0부터 다시 채운다. 이 과정을 (max-stage - 1)번
  #          반복한 뒤에야 성체가 된다. next-stage 가 비어 있는 펫은 종류는
  #          그대로 두고 단계 수만 늘어난다.
  #
  # 값을 올리면 모든 펫이 성체가 되기까지 더 오래 걸린다 — 기존 서버에서
  # 이미 균형을 잡아둔 상태라면 신중히 조정한다.
  max-stage: 1

  # 포만도. 먹일 때마다 min-gain~max-gain 사이에서 무작위로 오르고,
  # max 이상이면 더 못 먹인다 — 한 번에 몰아 먹여 순식간에 다 키우는 걸 막는다.
  # 시간이 지나도 저절로 안 내려간다. 끄고 싶으면 max 를 충분히 크게 둔다.
  fullness:
    min-gain: 5
    max-gain: 15
    max: 100

gimmick:
  # 아기 펫에게 짧은 시간 안에 먹이를 몰아주면 돼지로 변하는 이스터에그.
  overfeed:
    enabled: true
    count: 10            # 이 횟수 이상 (2 미만은 2로 올려 씁니다 — 끄려면 enabled: false)
    window-seconds: 60   # 이 시간 안에

    # 어떤 펫 종류로 변할지. pets/ 에 있는 id 여야 한다.
    # 이 종류가 없으면 상태만 '돼지'가 되고 모습은 그대로 남는다 (기동 시 경고).
    becomes: pig

ride:
  # 비행 상승력. 점프 키를 눌렀을 때 y 로 더해지는 값이다.
  flight-lift: 0.5

  # 비행 고도 상한. 빌드 높이가 아니라 별도로 둔다 — 원작처럼 빌드 높이 위
  # 빈 하늘로도 올라갈 수 있어야 한다. 터무니없는 y 값만 막는 안전장치다.
  flight-max-height: 1024.0
