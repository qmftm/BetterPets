# BetterPets 설정
#
# 이 서버는 동시 접속 5명 내외를 전제로 설계했다. 거리 LOD 나 커넥션 풀 같은
# 대규모 최적화는 의도적으로 넣지 않았다. 자세한 근거는 docs/DESIGN.md 참고.

# 언어. plugins/BetterPets/lang/<코드>.yml 을 읽는다.
# 기본 제공: ko_kr, en_us. 새로 만들려면 lang/ko_kr.yml 을 복사해 번역한다.
# 번역이 빠진 키는 내장 한국어로 채워지므로, 바꾸고 싶은 줄만 남겨도 된다.
language: ko_kr

# 서버 전체 알림. 희귀한 일에만 울려야 소음이 되지 않는다.
broadcast:
  enabled: true

  # 이 등급 이상일 때만 알린다. D C B A S 중 하나.
  # D 로 두면 사실상 모든 펫을 알리게 되니 채팅이 밀린다.
  min-rarity: A

  # 이 성장 단계 이상일 때만. 1 이면 단계 조건 없음.
  #
  # 주의: 알에서 갓 나온 펫은 언제나 1단계다. 2 이상으로 두면 on-obtain 알림은
  # 사실상 꺼진다. "일정 단계를 넘겼을 때 알린다"가 목적이라면 on-stage-up 을 켠다.
  # next-stage 로 여러 번 진화하는 펫이 하나도 없으면 이 단계는 항상 1이라 의미가 없다.
  min-growth-stage: 1

  on-obtain: false     # 알에서 나왔을 때 (뽑기 자랑)
  on-stage-up: true    # next-stage 로 다른 종류가 됐을 때
  sound: true          # 알림과 함께 효과음

integrations:
  # DiscordSRV 가 있으면 같은 알림을 Discord 로도 보낸다. 없으면 조용히 꺼진다.
  discord:
    enabled: true
    # DiscordSRV 의 게임 채널 이름. DiscordSRV config.yml 의 Channels 에 있는 키다.
    channel: global

pets:
  # 한 명이 보유할 수 있는 펫 마릿수. 한도에 닿으면 알을 우클릭해도
  # 아이템이 소비되지 않고 안내만 나간다.
  #
  # 0 이면 무제한이다. 보관함 GUI 는 한 쪽에 45마리씩 보여주므로,
  # 큰 값을 넣으면 쪽 넘김이 잦아진다.
  max-owned: 18

  # 동시에 소환해 둘 수 있는 펫 마릿수. 0 이면 무제한이다.
  #
  # 한도가 찬 상태에서 새로 소환하면 가장 먼저 소환했던 펫이 자동으로
  # 돌아간다 — 1 로 두면 예전처럼 "소환하면 교체" 동작이 된다.
  #
  # 올리기 전에 알아둘 것: 소환한 펫마다 캐리어 엔티티와 렌더 트래커가
  # 하나씩 생기고, 성체 펫의 능력치 보너스도 마리 수만큼 겹쳐서 붙는다.
  max-active: 1

growth:
  # 먹이 한 번에 오르는 성장도. 원작(우유)은 10이다.
  # 시간 경과는 꺼내져 있는 펫만, 1분당 +1 로 고정이며 설정 대상이 아니다.
  #
  # next-stage 가 없는 펫(더 진화할 곳이 없는 종류)은 성장도가 아예 오르지 않는다 —
  # 성장도의 유일한 역할이 다음 펫으로 진화시키는 것이라, 갈 곳이 없으면 잴 이유가 없다.
  # next-stage 가 있는 펫은 성장도가 다 차면 그 가중치로 다음 형태를 추첨하고
  # 성장도를 0부터 다시 채운다. 자기 자신을 넣으면 "한 단계 더 기다린다"가 된다.
  feed-amount: 10

  # 포만도. 먹일 때마다 min-gain~max-gain 사이에서 무작위로 오르고,
  # max 이상이면 더 못 먹인다 — 한 번에 몰아 먹여 순식간에 다 키우는 걸 막는다.
  # decay-seconds 마다 1씩 저절로 내려간다. 0 이하로 두면 감소가 꺼진다.
  fullness:
    min-gain: 5
    max-gain: 15
    max: 100
    decay-seconds: 30

gimmick:
  # 펫이 다음 형태로 자라는(next-stage 성장도가 다 차는) 순간, 포만도가 충분하면
  # 다음 형태 대신 돼지로 변하는 이스터에그. next-stage 가 없는(=자랄 일이 없는)
  # 종류는 애초에 이 순간이 오지 않으므로 대상이 되지 않습니다.
  overfeed:
    enabled: true

    # 진화하는 순간의 포만도가 이 값 이상이어야 돼지가 됩니다. 0 이면 조건 없음(항상 통과).
    min-fullness: 0

    # 위 조건을 채워도 실제로는 이 확률(%)로만 발동합니다. 100 이면 항상, 0 이면 절대
    # 발동하지 않습니다. 실패하면 원래대로 next-stage 진화가 일어납니다.
    chance: 100

    # 어떤 펫 종류로 변할지. pets/ 에 있는 id 여야 한다. 능력치·성장 상한·라이드 설정까지
    # 그 종류를 통째로 따르게 됩니다.
    # 이 종류가 없으면 종류(능력치)는 그대로 남고 아래 model 만 적용됩니다 (기동 시 경고).
    becomes: pig

    # 종류는 그대로 두고 모습(BetterModel 모델)만 이걸로 바꾸고 싶을 때 씁니다.
    # becomes 와는 별개입니다 — 둘 다 적으면 종류는 becomes 를 따르고 모습은 이 값을
    # 따릅니다. 비워두면(기본값) 모습은 종류의 model 을 그대로 씁니다.
    # model: pet_pig

ride:
  # 비행 상승력. 점프 키를 눌렀을 때 y 로 더해지는 값이다(스니크는 반대로 하강).
  # 이 펫만 다르게 하고 싶으면 pets/*.yml 에 flight-lift 를 적는다 — 안 적은 펫은
  # 이 전역값을 그대로 쓴다.
  flight-lift: 0.2

  # 비행 고도 상한. 빌드 높이가 아니라 별도로 둔다 — 원작처럼 빌드 높이 위
  # 빈 하늘로도 올라갈 수 있어야 한다. 터무니없는 y 값만 막는 안전장치다.
  flight-max-height: 512.0

  # 나는 펫이 추종할 때 주인 위로 띄워 둘 높이. 0 이 지금까지의 기본(발높이)이다.
  # 이 펫만 다르게 하고 싶으면 pets/*.yml 에 hover-height 를 적는다 — 안 적은 펫은
  # 이 전역값을 그대로 쓴다. 탑승 중에는 적용되지 않는다(추종할 때만).
  hover-height: 0.0

  # 탑승 시 플레이어가 앉는 높이를 기본 자리에서 위(+)·아래(-)로 밀어낸다.
  # 0 이 지금까지의 기본 자리다. 이 펫만 다르게 하고 싶으면 pets/*.yml 에
  # seat-offset 을 적는다 — 안 적은 펫은 이 전역값을 그대로 쓴다.
  seat-offset: 0.0

  # 지상 탑승 중 한 번에 오를 수 있는 블록 높이. 바닐라 말과 같은 1 이 기본이다.
  # 이보다 높은 턱은 막힌 벽으로 본다(내려가는 높이는 절벽 판정과 얽혀 있어
  # 별도로 열어두지 않는다). 나는 탑승에는 적용되지 않는다.
  max-step-height: 1.0

# 펫 관련 사운드·파티클. 모든 펫이 공통으로 쓴다(펫 종류별로 다르게 줄 수는 없다) —
# 이벤트 하나마다 sound(소리 이름)·volume·pitch·particle(파티클 이름)·particle-count 를
# 적을 수 있다. 이름은 Bukkit 의 Sound·Particle enum 이름을 그대로 쓴다(대소문자 무관).
# 오타는 /betterpets reload 응답에서 한 번에 알려준다.
#
# sound 나 particle 을 비우면 그 효과만 꺼지고, 이벤트 섹션 전체를 지우면(예: 이 줄
# 아래 dismount: 를 통째로 삭제) 그 이벤트는 아무 소리도 파티클도 내지 않는다.
effects:
  feed:
    sound: ENTITY_GENERIC_EAT
    volume: 0.8
    pitch: 1.0
    # particle: ITEM_SLIME
    # particle-count: 8

  # 나는 펫과 걷는 펫을 따로 뒀다 — 원래도 서로 다른 소리를 냈다.
  mount-ground:
    sound: ENTITY_HORSE_SADDLE
    volume: 1.0
    pitch: 1.0

  mount-flying:
    sound: ENTITY_PHANTOM_FLAP
    volume: 1.0
    pitch: 1.0

  # 지상·비행 하차, /pet dismount 세 경로가 전부 이 하나를 쓴다.
  dismount:
    sound: ENTITY_HORSE_LAND
    volume: 0.8
    pitch: 1.0

  # 먹여서 자란 경우와 시간이 흘러 자란 경우 둘 다 여기를 쓴다. 과급식으로 돼지가
  # 되는 건 제외다 — 그건 이스터에그 전용 소리(ENTITY_PIG_AMBIENT)로 따로 둔다.
  growth:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
    # particle: TOTEM_OF_UNDYING
    # particle-count: 20
