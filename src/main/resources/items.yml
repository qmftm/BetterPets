# 펫 관련 아이템 정의. 알과 먹이를 여기에 모아 둔다.
#
# 아이템 식별은 PDC(NBT)로 한다. 플레이어가 모루로 이름을 바꿔도 인식이 유지된다.
#
# item-model 은 리소스팩의 모델을 네임스페이스 키로 가리킨다 (MC 1.21.4+ 방식).
# 리소스팩이 없으면 생략해도 된다 — material 의 기본 모양으로 나온다.

# ── 알 ────────────────────────────────────────────────────────────
# 우클릭하면 알 안에 담긴 펫을 아기 상태로 보관함에 넣어준다.
#
#   gives   고정 알. 지정한 펫 하나를 준다
#   weights 랜덤 알. 가중치 추첨. 원작의 뽑기권을 아이템 하나로 대체한다
#           (먼저 적은 항목이 낮은 구간을 차지한다. 확률 비율 자체는 순서와 무관)
#   (둘 다 없으면) 각 펫이 pets/*.yml 에 적어둔 acquire.gacha-weight 를 표로 쓴다.
#           펫을 추가하면 이 파일을 안 고쳐도 뽑기 알에 들어간다
#
# 지급: /petadmin egg <플레이어> <알id> [개수]
eggs:

  wolf_egg:
    display-name: "<white>늑대 알"
    material: TURTLE_EGG
    gives: wolf
    # item-model: "betterpets:egg_wolf"

  dragon_egg:
    display-name: "<gold>드래곤 알"
    material: TURTLE_EGG
    gives: dragon
    # item-model: "betterpets:egg_dragon"

  # 성장 단계 예시용. config.yml 의 growth.max-stage 를 2 이상으로 두면
  # 이 알에서 나온 새끼가 자라면서 늑대나 드래곤이 된다 (pets/hatchling.yml 참고).
  hatchling_egg:
    display-name: "<gray>이름 모를 알"
    material: TURTLE_EGG
    gives: hatchling

  random_egg:
    display-name: "<white>수상한 알"
    material: EGG
    weights:
      wolf: 50
      dragon: 1
    # item-model: "betterpets:egg_random"

  # gives 도 weights 도 적지 않은 알. 펫 파일의 acquire.gacha-weight 를 그대로 쓴다.
  # 지금 설정 기준으로는 늑대 50 : 드래곤 1 이고, 돼지와 새끼는 0 이라 빠진다.
  # 새 펫을 만들 때 gacha-weight 만 적어두면 이 알에 자동으로 들어간다.
  gacha_egg:
    display-name: "<light_purple>뽑기 알"
    material: EGG

# ── 먹이 ──────────────────────────────────────────────────────────
# 소환한 펫에게 우클릭하면 먹인다. 성장도가 차면 다음 단계로 넘어간다.
#
#   growth  이 먹이가 올려줄 성장도.
#           적지 않으면 config.yml 의 growth.feed-amount 를 쓴다.
#
# 지급: /petadmin feed <플레이어> <먹이id> [개수]
feeds:

  milk:
    display-name: "<white>펫 우유"
    material: MILK_BUCKET
    growth: 10           # 원작의 우유가 +10 이다
    # item-model: "betterpets:feed_milk"

  premium_feed:
    display-name: "<gold>고급 사료"
    material: WHEAT
    growth: 30
    # item-model: "betterpets:feed_premium"
