# 한국어. 사용자에게 보이는 문자열은 전부 여기 있다.
#
# 다른 언어를 쓰려면 config.yml 의 language 를 바꾼다 (예: language: en_us).
# 새 언어를 만들려면 이 파일을 복사해 lang/<코드>.yml 로 저장하고 값을 번역한다.
#
# 형식은 MiniMessage 다 — https://docs.advntr.dev/minimessage/format.html
# %이름% 은 플러그인이 채우는 자리다. 위치는 옮겨도 되지만 철자는 그대로 둔다.
#
# 여기 없는 키는 내장 한국어 기본값으로 채워진다. 그래서 플러그인이 올라가
# 키가 늘어도 이 파일이 깨지지 않는다.

prefix: "<gray>[<gold>펫<gray>] </gray>"

pet:
  summoned: "<green>펫을 소환했습니다."
  summoned-replaced: "<green>펫을 소환했습니다. <gray>동시 소환 한도가 차서 가장 먼저 부른 펫은 돌아갔습니다."
  dismissed: "<gray>펫을 돌려보냈습니다."
  dismissed-count: "<gray>펫 <white>%count%<gray>마리를 돌려보냈습니다."
  none-active: "<red>소환 중인 펫이 없습니다."
  box-full: "<red>펫을 더 가질 수 없습니다. <gray>(최대 <white>%max%<gray>마리) 놓아주고 다시 시도하세요."
  not-found: "<red>그런 펫을 찾을 수 없습니다."
  model-missing: "<red>모델을 찾을 수 없습니다. 관리자에게 문의하세요."
  unknown-type: "<red>알 수 없는 펫 종류입니다."
  renamed: "<green>이름을 '<white>%name%<green>' 으로 바꿨습니다."
  name-too-long: "<red>이름은 32자를 넘을 수 없습니다."
  released: "<gray>펫을 놓아줬습니다."
  rename-hint: "<gray>/pet rename %id% <이름> 으로 바꿀 수 있습니다."
  rename-pick: "<yellow>여러 마리를 소환 중입니다. <gray>/pet rename <펫id> <이름> 으로 지정하세요."
  list-header: "<gray>보유한 펫 <white>%max%<gray> — 이름을 클릭하면 소환합니다."
  list-entry: "<dark_gray> %mark% <gray>[<white>%id%<gray>] <white>%name% <dark_gray>%stage%"
  list-hover: "<green>클릭해서 <white>%name%<green> 소환"
  list-empty: "<gray>가진 펫이 없습니다. <dark_gray>알을 우클릭해 얻으세요."

egg:
  unknown: "<red>알 수 없는 알입니다."
  broken-definition: "<red>이 알의 설정이 잘못됐습니다. 관리자에게 문의하세요."
  opened: "<green>알에서 <white>%name%<green> 이(가) 나왔습니다!"
  lore-guaranteed: "<gray>→ <white>%pet%"
  lore-header: "<gray>나올 수 있는 펫"
  lore-entry: "<dark_gray>· <white>%pet% <gray>%chance%"
  lore-more: "<dark_gray>그 외 %count%종"

feed:
  fed: "<green>먹이를 줬습니다. <gray>성장도 <white>%growth%<gray>/<white>%max%"
  stage-up: "<aqua>성장 단계가 올랐습니다! <gray>(%stage%/%max% 단계)"
  grew-up: "<gold>다 자랐습니다! 이제 탈 수 있습니다."
  became-pig: "<yellow>너무 많이 먹여서... 돼지가 됐습니다."
  already-grown: "<gray>이미 다 자란 펫입니다."
  unknown: "<red>설정에 없는 먹이입니다. 관리자에게 문의하세요."
  lore-growth: "<gray>성장도 <white>+%growth%"

ride:
  started-ground: "<green>탑승했습니다. <gray>바라보며 이동, 스니크로 하차."
  started-flying: "<gold>비행을 시작합니다. <gray>점프로 상승, 스니크로 하차."
  confirm: "<gold>한 번 더 우클릭하면 날아오릅니다."
  stopped: "<gray>내렸습니다."
  not-riding: "<red>타고 있지 않습니다."
  not-rideable: "<red>이 펫은 탈 수 없습니다."
  too-young: "<yellow>아직 아기라 탈 수 없습니다. 다 자라야 합니다."
  failed: "<red>여기서는 탈 수 없습니다."

command:
  unknown: "<red>알 수 없는 명령입니다. <gray>/pet"
  summon-usage: "<gray>/pet summon <펫id앞자리>"
  rename-usage: "<gray>/pet rename <이름>"

admin:
  player-not-found: "<red>플레이어를 찾을 수 없습니다."
  unknown-pet-type: "<red>알 수 없는 펫 종류: <white>%id%"
  unknown-egg: "<red>알 수 없는 알: <white>%id%"
  unknown-feed: "<red>알 수 없는 먹이: <white>%id%"
  box-full: "<red><white>%player%<red> 의 보유 한도가 찼습니다."
  given: "<green><white>%player%<green> 에게 <white>%type%<green> 펫을 줬습니다."
  egg-given: "<green><white>%player%<green> 에게 알 <white>%id%<green> 을 줬습니다."
  feed-given: "<green><white>%player%<green> 에게 먹이 <white>%id%<green> 을 줬습니다."
  growth-given: "<green>성장도 <white>%amount%<green> 를 줬습니다."
  growth-not-positive: "<red>성장도는 1 이상이어야 합니다. <gray>(받은 값: <white>%amount%<gray>)"
  reloaded: "<green>설정을 다시 읽었습니다. <gray>펫 <white>%pets%<gray>종, 알 <white>%eggs%<gray>종, 먹이 <white>%feeds%<gray>종"
  reloaded-with-problems: "<yellow>설정을 읽었지만 <white>%count%<yellow>개의 문제가 있습니다:"

broadcast:
  obtained: "<gray>[<gold>펫<gray>] <white>%player%<gray> 님이 <white>%rarity%<gray> 등급 <white>%pet%<gray> 을(를) 얻었습니다!"
  grown: "<gray>[<gold>펫<gray>] <white>%player%<gray> 님의 <white>%rarity%<gray> 등급 <white>%pet%<gray> 이(가) 다 자랐습니다!"
  stage-up: "<gray>[<gold>펫<gray>] <white>%player%<gray> 님의 <white>%pet%<gray> 이(가) <white>%stage%<gray>단계가 됐습니다!"

help:
  summon: "<gray>/pet summon <펫id> <dark_gray>— 소환"
  dismiss: "<gray>/pet dismiss [펫id] <dark_gray>— id 를 주면 그 한 마리만, 없으면 전부 돌려보냄"
  dismount: "<gray>/pet dismount <dark_gray>— 하차"
  rename: "<gray>/pet rename [펫id] <이름> <dark_gray>— 이름 변경"
  list: "<gray>/pet list <dark_gray>— 채팅으로 목록 보기 (클릭해서 소환)"
