name: BetterPets
version: '${project.version}'
main: kr.qmftm.betterpets.BetterPetsPlugin
description: 악어의 놀이터 스타일 펫 시스템 — BetterModel 기반
api-version: '26.2'
authors:
  - qmftm

dependencies:
  server:
    # 펫의 본체가 3D 모델이므로 BetterModel 은 선택 사항이 아니다.
    BetterModel:
      load: BEFORE
      required: true
      join-classpath: true
    # %betterpets_...% 확장. 상속이 필요해 유일하게 컴파일 의존을 건 연동이다.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    # 알림을 Discord 로도 보낸다. 없으면 조용히 꺼진다.
    DiscordSRV:
      load: BEFORE
      required: false
      join-classpath: false
    # Bedrock 플레이어 구분. 없으면 전원 자바로 취급한다.
    floodgate:
      load: BEFORE
      required: false
      join-classpath: false
    Geyser-Spigot:
      load: BEFORE
      required: false
      join-classpath: false
    # BetterModel 모델을 Bedrock 에 변환해 보여준다. 없으면 Bedrock 에는 히트박스만 보인다.
    GeyserModelEngine:
      load: BEFORE
      required: false
      join-classpath: false

commands:
  pet:
    description: 펫 보관함을 열고 소환/해제한다
    usage: /pet [summon|dismiss|dismount|rename]
    permission: betterpets.use
  petadmin:
    description: 펫 관리자 명령
    usage: /petadmin [give|egg|growth|reload|debug]
    permission: betterpets.admin

permissions:
  betterpets.use:
    description: 펫 보관함 열기, 소환/해제 등 기본 기능
    default: true
  betterpets.admin:
    description: 모든 관리자 명령
    default: op
