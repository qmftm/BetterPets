# 등급별 표시 이름.
#
# 등급(D C B A S)은 표기 전용이다 — 이동속도·탑승속도 같은 실제 능력치에는
# 관여하지 않는다. 서열은 broadcast.min-rarity 같은 문턱 판정에만 쓰인다.
# 실제 속도를 펫마다 다르게 하고 싶으면 pets/*.yml 의 ride-speed 를 적는다.
#
# 등급을 적지 않으면 내장 기본값을 쓴다. 등급 자체(D C B A S)와 그 서열은
# 코드에 있어서 여기서 바꿀 수 없다.
#
#   display-name   GUI 와 알림에 보이는 이름. MiniMessage 를 쓸 수 있다
#
# 비행 여부는 등급이 아니라 펫 종류의 flying 설정으로만 정해진다 — 등급별 확률
# 추첨은 없다 (pets/*.yml 의 ride/flying 참고).

rarities:
  D:
    display-name: "일반"

  C:
    display-name: "고급"

  B:
    display-name: "희귀"

  A:
    display-name: "영웅"

  S:
    display-name: "전설"
